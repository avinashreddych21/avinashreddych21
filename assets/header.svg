<svg fill="none" viewBox="0 0 960 280" width="100%" height="280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Obsidian Void Background Gradient -->
    <linearGradient id="cyber-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02040A" />
      <stop offset="45%" stop-color="#060D1E" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Ambient Quantum Glows -->
    <radialGradient id="quantum-cyan" cx="15%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#02040A" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="hyper-violet" cx="85%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.16" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#02040A" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="emerald-glow" cx="50%" cy="90%" r="45%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.14" />
      <stop offset="60%" stop-color="#059669" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#02040A" stop-opacity="0" />
    </radialGradient>

    <!-- Laser Divider Beam -->
    <linearGradient id="laser-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0" />
      <stop offset="25%" stop-color="#00D2FF" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#A7F3D0" stop-opacity="1" />
      <stop offset="75%" stop-color="#8B5CF6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </linearGradient>

    <!-- Name Metallic Gradient -->
    <linearGradient id="name-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>

    <!-- Micro Grid Pattern -->
    <pattern id="matrix-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#38BDF8" stroke-opacity="0.04" stroke-width="0.8" />
      <circle cx="28" cy="28" r="0.75" fill="#38BDF8" fill-opacity="0.16" />
    </pattern>

    <!-- Outer Frame Animated Stroke Gradient -->
    <linearGradient id="border-pulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF">
        <animate attributeName="stop-color" values="#00D2FF;#8B5CF6;#10B981;#00D2FF" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#8B5CF6">
        <animate attributeName="stop-color" values="#8B5CF6;#10B981;#00D2FF;#8B5CF6" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981;#00D2FF;#8B5CF6;#10B981" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, 'JetBrains Mono', Menlo, Monaco, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .title-text { letter-spacing: 13px; font-weight: 800; }
    .hud-text { letter-spacing: 1.5px; }
  </style>

  <!-- Base Cyberpunk Chamfered Outer Shell -->
  <path d="M 32 14 L 928 14 L 946 32 L 946 248 L 928 266 L 32 266 L 14 248 L 14 32 Z" fill="url(#cyber-bg)" stroke="url(#border-pulse)" stroke-width="1.2" stroke-opacity="0.7" />

  <!-- Technical Node Matrix Grid Overlay -->
  <path d="M 32 14 L 928 14 L 946 32 L 946 248 L 928 266 L 32 266 L 14 248 L 14 32 Z" fill="url(#matrix-grid)" />

  <!-- Ambient Light Flares -->
  <rect width="960" height="280" fill="url(#quantum-cyan)" />
  <rect width="960" height="280" fill="url(#hyper-violet)" />
  <rect width="960" height="280" fill="url(#emerald-glow)" />

  <!-- Futuristic Chamfered Tech Brackets (4 Corners) -->
  <path d="M 22 42 L 22 24 L 40 24" fill="none" stroke="#00D2FF" stroke-width="1.8" stroke-opacity="0.8" />
  <path d="M 938 42 L 938 24 L 920 24" fill="none" stroke="#8B5CF6" stroke-width="1.8" stroke-opacity="0.8" />
  <path d="M 22 238 L 22 256 L 40 256" fill="none" stroke="#10B981" stroke-width="1.8" stroke-opacity="0.8" />
  <path d="M 938 238 L 938 256 L 920 256" fill="none" stroke="#00D2FF" stroke-width="1.8" stroke-opacity="0.8" />

  <!-- ============================================================== -->
  <!-- TOP HUD TELEMETRY BAR                                          -->
  <!-- ============================================================== -->
  <g>
    <!-- Terminal Node Indicator -->
    <circle cx="50" cy="44" r="3.5" fill="#38BDF8" opacity="0.9" />
    <circle cx="62" cy="44" r="3.5" fill="#818CF8" opacity="0.9" />
    <circle cx="74" cy="44" r="3.5" fill="#34D399" opacity="0.9" />
    <text class="mono hud-text" x="92" y="48" font-size="11" font-weight="600" fill="#94A3B8">SYS.ID: AR-2026 // KERNEL: ONLINE</text>

    <!-- Animated Frequency Spectrum Visualizer (Live Audio / Telemetry Waves) -->
    <g transform="translate(380, 48)">
      <rect x="0" y="-8" width="2.5" height="10" fill="#00D2FF" rx="1">
        <animate attributeName="height" values="4;14;6;12;4" dur="1.2s" repeatCount="indefinite" />
        <animate attributeName="y" values="-2;-7;-3;-6;-2" dur="1.2s" repeatCount="indefinite" />
      </rect>
      <rect x="5" y="-12" width="2.5" height="14" fill="#38BDF8" rx="1">
        <animate attributeName="height" values="8;16;5;15;8" dur="1.4s" repeatCount="indefinite" />
        <animate attributeName="y" values="-4;-8;-2.5;-7.5;-4" dur="1.4s" repeatCount="indefinite" />
      </rect>
      <rect x="10" y="-14" width="2.5" height="18" fill="#818CF8" rx="1">
        <animate attributeName="height" values="10;18;7;17;10" dur="1.1s" repeatCount="indefinite" />
        <animate attributeName="y" values="-5;-9;-3.5;-8.5;-5" dur="1.1s" repeatCount="indefinite" />
      </rect>
      <rect x="15" y="-10" width="2.5" height="12" fill="#34D399" rx="1">
        <animate attributeName="height" values="5;15;8;13;5" dur="1.5s" repeatCount="indefinite" />
        <animate attributeName="y" values="-2.5;-7.5;-4;-6.5;-2.5" dur="1.5s" repeatCount="indefinite" />
      </rect>
    </g>

    <!-- Geo Node Coordinates -->
    <text class="mono" x="520" y="48" font-size="10" font-weight="500" fill="#64748B" letter-spacing="2">SRM UNIVERSITY AP · AMARAVATI (16.51°N, 80.51°E)</text>

    <!-- Live Status Chip -->
    <rect x="764" y="32" width="144" height="24" rx="6" fill="#081024" stroke="#1E293B" stroke-width="1" />
    <circle cx="778" cy="44" r="3.5" fill="#10B981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text class="mono" x="788" y="47.5" font-size="9.5" font-weight="600" fill="#6EE7B7" letter-spacing="1">STATUS: OPERATIONAL</text>
  </g>

  <!-- Top Separator Grid Line -->
  <line x1="42" y1="66" x2="918" y2="66" stroke="#1E293B" stroke-width="1" stroke-dasharray="8 4" />

  <!-- ============================================================== -->
  <!-- MAIN HERO IDENTITY CENTER                                      -->
  <!-- ============================================================== -->
  <g transform="translate(480, 0)">
    <!-- Tech Category Tagline -->
    <text class="mono" x="0" y="100" font-size="11" font-weight="600" fill="#00D2FF" text-anchor="middle" letter-spacing="4">
      // INTELLIGENT SYSTEMS · FULL-STACK ARCHITECTURE
    </text>

    <!-- Full Hero Name with Precision Metallic Finish -->
    <text class="sans title-text" x="-6" y="148" font-size="44" fill="url(#name-metal)" text-anchor="middle">
      AVINASH REDDY
    </text>

    <!-- Laser Divider Beam with Central Quantum Diamond -->
    <line x1="-220" y1="168" x2="220" y2="168" stroke="url(#laser-beam)" stroke-width="1.8" />
    <!-- Glowing Diamond Reticle -->
    <polygon points="0,163 5,168 0,173 -5,168" fill="#A7F3D0" />
    <circle cx="0" cy="168" r="1.5" fill="#02040A" />

    <!-- Dynamic Cycling Specializations -->
    <g transform="translate(0, 192)">
      <!-- Role 1 -->
      <g opacity="1">
        <animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;0.30;0.33;0.66;0.96;0.99;1" dur="9s" repeatCount="indefinite" />
        <text class="mono" x="0" y="0" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle" letter-spacing="2">
          Machine Learning Pipelines <tspan fill="#00D2FF">◈</tspan> Predictive Analytics Engine
        </text>
      </g>
      <!-- Role 2 -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;0.33;0.36;0.63;0.66;0.99;1" dur="9s" repeatCount="indefinite" />
        <text class="mono" x="0" y="0" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle" letter-spacing="2">
          Scalable Web Systems <tspan fill="#8B5CF6">◈</tspan> Reactive Full-Stack Development
        </text>
      </g>
      <!-- Role 3 -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;0.66;0.69;0.96;0.99;1;1" dur="9s" repeatCount="indefinite" />
        <text class="mono" x="0" y="0" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle" letter-spacing="2">
          Algorithmic Rigor <tspan fill="#10B981">◈</tspan> Data Structures &amp; Core Systems
        </text>
      </g>
    </g>
  </g>

  <!-- Bottom Separator Grid Line -->
  <line x1="42" y1="214" x2="918" y2="214" stroke="#1E293B" stroke-width="1" stroke-dasharray="8 4" />

  <!-- ============================================================== -->
  <!-- BOTTOM TELEMETRY HARDWARE MODULES                              -->
  <!-- ============================================================== -->
  <g>
    <!-- Module 1: ML & Neural Data -->
    <g transform="translate(44, 226)">
      <rect width="206" height="30" rx="5" fill="#050C1D" stroke="#0284C7" stroke-width="0.9" stroke-opacity="0.6" />
      <circle cx="14" cy="15" r="3" fill="#00D2FF" />
      <text class="mono" x="24" y="19" font-size="9" font-weight="600" fill="#E0F2FE" letter-spacing="1">01 // ML &amp; NEURAL DATA</text>
      <text class="mono" x="194" y="19" font-size="8" fill="#38BDF8" text-anchor="end">SCIKIT</text>
    </g>

    <!-- Module 2: Full-Stack Web -->
    <g transform="translate(262, 226)">
      <rect width="206" height="30" rx="5" fill="#050C1D" stroke="#334155" stroke-width="0.9" />
      <circle cx="14" cy="15" r="3" fill="#818CF8" />
      <text class="mono" x="24" y="19" font-size="9" font-weight="600" fill="#E2E8F0" letter-spacing="1">02 // FULL-STACK ENGINE</text>
      <text class="mono" x="194" y="19" font-size="8" fill="#818CF8" text-anchor="end">NODE.JS</text>
    </g>

    <!-- Module 3: Systems & Algorithms -->
    <g transform="translate(480, 226)">
      <rect width="206" height="30" rx="5" fill="#050C1D" stroke="#334155" stroke-width="0.9" />
      <circle cx="14" cy="15" r="3" fill="#34D399" />
      <text class="mono" x="24" y="19" font-size="9" font-weight="600" fill="#E2E8F0" letter-spacing="1">03 // SYSTEMS &amp; CORE DSA</text>
      <text class="mono" x="194" y="19" font-size="8" fill="#34D399" text-anchor="end">JAVA/C++</text>
    </g>

    <!-- Module 4: Persistence & Ops -->
    <g transform="translate(698, 226)">
      <rect width="206" height="30" rx="5" fill="#050C1D" stroke="#334155" stroke-width="0.9" />
      <circle cx="14" cy="15" r="3" fill="#A78BFA" />
      <text class="mono" x="24" y="19" font-size="9" font-weight="600" fill="#E2E8F0" letter-spacing="1">04 // DATA &amp; DEPLOYMENT</text>
      <text class="mono" x="194" y="19" font-size="8" fill="#A78BFA" text-anchor="end">MONGODB</text>
    </g>
  </g>
</svg>
