<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="1180" height="610" role="img" aria-label="Avinash Reddy - Developer Profile Dashboard">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient_dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGlow_dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#818CF8;#34D399;#38BDF8" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#818CF8">
        <animate attributeName="stop-color" values="#818CF8;#34D399;#38BDF8;#818CF8" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#34D399">
        <animate attributeName="stop-color" values="#34D399;#38BDF8;#818CF8;#34D399" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Scanline Gradient -->
    <linearGradient id="scanlineGrad_dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="30%" stop-color="#22D3EE" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#818CF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern_dark" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1E293B" stroke-width="0.6" stroke-opacity="0.35"/>
    </pattern>

    <!-- Soft Drop Shadow -->
    <filter id="cardShadow_dark" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.0"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .ascii {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 11.2px;
      letter-spacing: 1.8px;
      line-height: 12px;
      fill: #38BDF8;
    }
  </style>

  <!-- Outer Canvas Background -->
  <rect x="0" y="0" width="1180" height="610" rx="24" fill="url(#bgGradient_dark)"/>
  <rect x="0" y="0" width="1180" height="610" rx="24" fill="url(#gridPattern_dark)"/>

  <!-- Outer Frame Animated Border -->
  <rect x="12" y="12" width="1156" height="586" rx="20" fill="none" stroke="url(#borderGlow_dark)" stroke-width="1.5" stroke-opacity="0.65"/>

  <!-- ============================================================== -->
  <!-- LEFT COLUMN: VISUAL.MAP / IDENTITY (x=30, y=30, w=410, h=550)  -->
  <!-- ============================================================== -->
  <g id="left-panel">
    <!-- Panel Glass Container -->
    <rect x="30" y="30" width="410" height="550" rx="16" fill="#0B132B" fill-opacity="0.75" stroke="#1E293B" stroke-width="1" filter="url(#cardShadow_dark)"/>

    <!-- Header Chrome -->
    <circle cx="52" cy="52" r="5" fill="#EF4444"/>
    <circle cx="68" cy="52" r="5" fill="#F59E0B"/>
    <circle cx="84" cy="52" r="5" fill="#10B981"/>
    <text x="106" y="56" class="mono" font-size="12" fill="#94A3B8">avinash@developer:~</text>
    <text x="420" y="56" text-anchor="end" class="mono" font-size="11" font-weight="bold" fill="#38BDF8">[ VISUAL.MAP ]</text>
    <line x1="30" y1="72" x2="440" y2="72" stroke="#1E293B" stroke-width="1"/>

    <!-- ASCII Portrait Frame -->
    <rect x="48" y="88" width="374" height="328" rx="10" fill="#020617" fill-opacity="0.85" stroke="#1E293B" stroke-width="1"/>

