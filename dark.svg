      <!-- Row 1: Location -->
      <text x="0" y="0" fill="#64748B">&gt; LOCATION</text>
      <text x="100" y="0" fill="#94A3B8">:</text>
      <text x="116" y="0" fill="#F8FAFC">India</text>

      <!-- Row 2: Degree -->
