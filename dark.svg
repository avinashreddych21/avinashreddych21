        <text x="0" y="0" class="mono" font-size="13" fill="#38BDF8">target.role <tspan fill="#94A3B8">=</tspan> </text>
        
        <!-- Rotating Text 1: Software Engineer -->
        <g opacity="1">
          <animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;0.30;0.33;0.66;0.96;0.99;1" dur="12s" repeatCount="indefinite"/>
          <text x="108" y="0" class="mono" font-size="13" font-weight="bold" fill="#34D399">"Software Engineer"</text>
        </g>
        
        <!-- Rotating Text 2: Full-Stack Developer -->
