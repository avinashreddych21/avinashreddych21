    <path d="M 54 100 L 54 94 L 60 94" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.7"/>
    <path d="M 416 100 L 416 94 L 410 94" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.7"/>
    <path d="M 54 404 L 54 410 L 60 410" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.7"/>
    <path d="M 416 404 L 416 410 L 410 410" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.7"/>

    <!-- Subtitle Inside Portrait Frame -->
    <text x="64" y="110" class="mono" font-size="9" letter-spacing="1.5" fill="#64748B">STREAM // BIO_ASCII_01</text>
    <text x="406" y="110" text-anchor="end" class="mono" font-size="9" letter-spacing="1" fill="#34D399">● LIVE</text>

    <!-- ASCII Art Text Block -->
    <text x="235" y="132" text-anchor="middle" class="ascii" xml:space="preserve">
          <tspan x="235" dy="0">                                      </tspan>
          <tspan x="235" dy="12.0">                                      </tspan>
          <tspan x="235" dy="12.0">          %%*::::·......·+#%%         </tspan>
          <tspan x="235" dy="12.0">          #+···::·.......··*@         </tspan>
          <tspan x="235" dy="12.0">          +....··:::·......:%         </tspan>
          <tspan x="235" dy="12.0">          ·...·+****++::·...%         </tspan>
          <tspan x="235" dy="12.0">          ·.:+*##%%%##*++:.·%         </tspan>
          <tspan x="235" dy="12.0">          *·+:··:*#*:·::+.:%         </tspan>
          <tspan x="235" dy="12.0">          #:+::..:#:.:.··+·::         </tspan>
          <tspan x="235" dy="12.0">          ::*++::+%*:++***:·:#        </tspan>
          <tspan x="235" dy="12.0">          :·*###**%#+*%##*·:*         </tspan>
          <tspan x="235" dy="12.0">          *::*###:+:·*%#*+·+#         </tspan>
          <tspan x="235" dy="12.0">          %#·:+::::··::++·:%%         </tspan>
          <tspan x="235" dy="12.0">          %%#·::+***+::+·.###         </tspan>
          <tspan x="235" dy="12.0">          %%%#·:++**+++·.+%##         </tspan>
          <tspan x="235" dy="12.0">          #%#%:..·::··..·*%%#         </tspan>
          <tspan x="235" dy="12.0">          ##%#++:·...·:++:#%#         </tspan>
          <tspan x="235" dy="12.0">          #%%#:***++++**+·*#*         </tspan>
          <tspan x="235" dy="12.0">               +*****+*+:·*           </tspan>
          <tspan x="235" dy="12.0">              #:+*+:+**:::#           </tspan>
          <tspan x="235" dy="12.0">               #+*::+*:++#%           </tspan>
          <tspan x="235" dy="12.0">            *+.:#*+·:::*#%%           </tspan>
          <tspan x="235" dy="12.0">            %%::%##:··*%@%:***        </tspan>
          <tspan x="235" dy="12.0">           #%%:·*%%%·##*::*%%%%       </tspan>
    </text>

    <!-- Animated Scanline -->
    <line x1="48" y1="90" x2="422" y2="90" stroke="url(#scanlineGrad_dark)" stroke-width="2" opacity="0.75">
      <animate attributeName="y1" values="92;412;92" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="92;412;92" dur="5s" repeatCount="indefinite"/>
    </line>

    <!-- Terminal Prompt & Status Block Below Portrait -->
    <g transform="translate(50, 430)">
      <text x="0" y="14" class="mono" font-size="11" fill="#38BDF8">~/profile $ <tspan fill="#94A3B8">./status --telemetry</tspan></text>
      
      <!-- Telemetry chips -->
      <g transform="translate(0, 28)">
        <rect x="0" y="0" width="176" height="24" rx="6" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
        <circle cx="10" cy="12" r="3.5" fill="#34D399"/>
        <text x="20" y="16" class="mono" font-size="10" fill="#E2E8F0">SYSTEM : ONLINE</text>

        <rect x="184" y="0" width="182" height="24" rx="6" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
        <circle cx="194" cy="12" r="3.5" fill="#38BDF8"/>
        <text x="204" y="16" class="mono" font-size="10" fill="#E2E8F0">CAMPUS : SRM AP</text>
      </g>

      <g transform="translate(0, 58)">
        <rect x="0" y="0" width="176" height="24" rx="6" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
        <circle cx="10" cy="12" r="3.5" fill="#818CF8"/>
        <text x="20" y="16" class="mono" font-size="10" fill="#E2E8F0">MAJOR : CSE DEGREE</text>

        <rect x="184" y="0" width="182" height="24" rx="6" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
        <circle cx="194" cy="12" r="3.5" fill="#34D399"/>
        <text x="204" y="16" class="mono" font-size="10" fill="#E2E8F0">CORE  : ML + FULLSTACK</text>
      </g>
    </g>
